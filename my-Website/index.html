<!DOCTYPE html>
<html>
<head>
<title>HNP CAPTCHA</title>

<style>
body{
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Segoe UI;
}

.container{
background:#1e293b;
padding:30px;
border-radius:10px;
text-align:center;
width:400px;
}

input,button{
width:100%;
padding:10px;
margin-top:10px;
}

button{
background:#3b82f6;
border:none;
color:white;
font-weight:bold;
}

canvas{margin-top:10px;}

#score{color:#22c55e;}
</style>
</head>

<body>

<div class="container">

<h3>Human Neuro-Perception CAPTCHA</h3>

<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">

<p id="question"></p>

<canvas id="captchaCanvas" width="320" height="120"></canvas>

<input id="captchaInput" placeholder="Enter answer">

<button onclick="verify()">Login</button>

<p id="status"></p>
<p id="score"></p>

</div>

<script>

/* ===== Behaviour Tracking ===== */
let movements=0, clicks=0, keys=0, startTime=Date.now()

document.addEventListener("mousemove",()=>movements++)
document.addEventListener("click",()=>clicks++)
document.addEventListener("keydown",()=>keys++)

/* ===== QUESTION BANK ===== */
const questionBank = {
Easy: [
"Enter characters closer to top",
"Enter characters closer to bottom",
"Enter larger characters",
"Enter smaller characters",
"Enter darker characters",
"Enter straight (non-tilted) characters",
"Enter the first 2 characters",
"Enter the last 2 characters"
],

Medium: [
"Enter tilted characters",
"Enter blurred characters",
"Enter characters in different font",
"Enter compressed characters"
],

Hard: [
"Enter overlapping characters",
"Enter characters crossed by curve"
]
}

let currentDifficulty = "Easy"
let currentQuestion = ""
let meta = []

function pickQuestion(){
let list = questionBank[currentDifficulty]
currentQuestion = list[Math.floor(Math.random()*list.length)]

document.getElementById("question").innerText =
currentQuestion + " (" + currentDifficulty + ")"
}

/* ===== CAPTCHA GENERATION ===== */
function generateCaptcha(){

const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"
meta=[]

for(let i=0;i<6;i++){

meta.push({
char: chars[Math.floor(Math.random()*chars.length)],
x: 30+i*40,
y: 40+Math.random()*40,
angle: (Math.random()-0.5)*1.5,
size: 28+Math.random()*15,
color: Math.random()*150,
font: Math.random()>0.5?"Arial":"Courier",
blur: Math.random()>0.7,
overlap: Math.random()>0.6,
curve: Math.random()>0.6
})

}
}

function drawCaptcha(){

generateCaptcha()
pickQuestion()

let c=document.getElementById("captchaCanvas")
let ctx=c.getContext("2d")

ctx.clearRect(0,0,320,120)

/* HARD → curve */
if(currentDifficulty==="Hard"){
ctx.beginPath()
for(let i=0;i<320;i++){
ctx.lineTo(i,60+Math.sin(i*0.05)*20)
}
ctx.stroke()
}

meta.forEach(m=>{

ctx.save()
ctx.translate(m.x,m.y)
ctx.rotate(m.angle)

ctx.font=`bold ${m.size}px ${m.font}`
ctx.fillStyle=`rgb(${m.color},${m.color},${m.color})`

if(m.blur && currentDifficulty!=="Easy") ctx.globalAlpha=0.5

ctx.fillText(m.char,0,0)
ctx.restore()

if(m.overlap && currentDifficulty!=="Easy"){
ctx.beginPath()
ctx.moveTo(m.x-10,m.y-10)
ctx.lineTo(m.x+20,m.y+10)
ctx.strokeStyle="red"
ctx.stroke()
}

})

}

/* ===== ANSWER LOGIC ===== */
function getAnswer(){

let res=""

meta.forEach((m,i)=>{

if(currentQuestion.includes("top") && m.y<50) res+=m.char
if(currentQuestion.includes("bottom") && m.y>70) res+=m.char
if(currentQuestion.includes("larger") && m.size>35) res+=m.char
if(currentQuestion.includes("smaller") && m.size<32) res+=m.char
if(currentQuestion.includes("darker") && m.color<70) res+=m.char
if(currentQuestion.includes("straight") && Math.abs(m.angle)<0.2) res+=m.char

if(currentQuestion.includes("tilted") && Math.abs(m.angle)>0.5) res+=m.char
if(currentQuestion.includes("blurred") && m.blur) res+=m.char
if(currentQuestion.includes("font") && m.font==="Courier") res+=m.char
if(currentQuestion.includes("compressed") && i>0 && Math.abs(meta[i].x-meta[i-1].x)<35) res+=m.char

if(currentQuestion.includes("overlapping") && m.overlap) res+=m.char
if(currentQuestion.includes("curve") && m.curve) res+=m.char

})

if(currentQuestion.includes("first 2")){
return meta[0].char + meta[1].char
}

if(currentQuestion.includes("last 2")){
let n = meta.length
return meta[n-2].char + meta[n-1].char
}

return res
}

/* ===== VERIFY ===== */
async function verify(){

let correct=getAnswer()
let input=document.getElementById("captchaInput").value.toUpperCase()

let res=await fetch("http://127.0.0.1:5000/verify",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:document.getElementById("username").value,
password:document.getElementById("password").value,
captcha_answer:correct,
user_input:input,
question:currentQuestion,
mouse:movements,
clicks:clicks,
keys:keys,
time:(Date.now()-startTime)
})
})

let data=await res.json()

document.getElementById("status").innerText=data.status

/* 🔥 FIX: regenerate when difficulty changes */
if(data.difficulty){
if(currentDifficulty !== data.difficulty){
currentDifficulty = data.difficulty
drawCaptcha()   // 🔥 IMPORTANT
return
}
}

/* show score */
if(data.human_score){
document.getElementById("score").innerText =
"Human Score: " + data.human_score + "%"
}

/* redraw on wrong */
if(data.status.includes("Wrong")){
drawCaptcha()
}

/* reset on success */
if(data.status.includes("Access Granted")){
currentDifficulty="Easy"
movements=clicks=keys=0
startTime=Date.now()
}

}

/* ===== START ===== */
window.onload = () => drawCaptcha()

</script>

</body>
</html>
